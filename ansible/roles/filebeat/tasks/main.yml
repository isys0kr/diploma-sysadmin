---
- name: Установить зависимости
  apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
    state: present
    update_cache: true

- name: Скачать ключ Elastic
  get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /tmp/elasticsearch.key
    mode: "0644"

- name: Установить ключ Elastic
  shell: |
    gpg --dearmor --yes \
      -o /usr/share/keyrings/elasticsearch-keyring.gpg \
      /tmp/elasticsearch.key
  args:
    creates: /usr/share/keyrings/elasticsearch-keyring.gpg

- name: Добавить зеркало Elastic Яндекса
  copy:
    dest: /etc/apt/sources.list.d/elastic-8.x.list
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://mirror.yandex.ru/mirrors/elastic/8 stable main

- name: Установить Filebeat
  apt:
    name: filebeat
    state: present
    update_cache: true

- name: Настроить Filebeat
  template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: "0600"
  notify: Перезапустить Filebeat

- name: Запустить Filebeat
  systemd:
    name: filebeat
    enabled: true
    state: started
