---
- name: Установить Elasticsearch 8.19.21
  ansible.builtin.apt:
    name: elasticsearch=8.19.21
    state: present
  become: true

- name: Настроить Elasticsearch
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: Перезапустить Elasticsearch
  become: true

- name: Ограничить память Elasticsearch
  ansible.builtin.copy:
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    owner: root
    group: elasticsearch
    mode: "0660"
    content: |
      -Xms1g
      -Xmx1g
  notify: Перезапустить Elasticsearch
  become: true

- name: Удалить автоматические secure-настройки Elasticsearch
  ansible.builtin.shell: |
    for key in \
      xpack.security.transport.ssl.keystore.secure_password \
      xpack.security.transport.ssl.truststore.secure_password \
      xpack.security.http.ssl.keystore.secure_password
    do
      if /usr/share/elasticsearch/bin/elasticsearch-keystore list | grep -Fxq "$key"; then
        /usr/share/elasticsearch/bin/elasticsearch-keystore remove "$key"
        echo "$key"
      fi
    done
  args:
    executable: /bin/bash
  register: elasticsearch_keystore_cleanup
  changed_when: elasticsearch_keystore_cleanup.stdout != ""
  notify: Перезапустить Elasticsearch
  become: true

- name: Запустить Elasticsearch
  ansible.builtin.systemd:
    name: elasticsearch
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Дождаться запуска Elasticsearch
  ansible.builtin.uri:
    url: http://127.0.0.1:9200/
    status_code: 200
  register: elastic_health
  retries: 30
  delay: 5
  until: elastic_health.status == 200
