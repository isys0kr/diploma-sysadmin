---
- name: Установить зависимости
  ansible.builtin.apt:
    name:
      - wget
      - gnupg
      - ca-certificates
    state: present
    update_cache: true
  become: true

- name: Скачать пакет репозитория Zabbix
  ansible.builtin.get_url:
    url: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb
    dest: /tmp/zabbix-release.deb
    mode: "0644"
  become: true

- name: Установить репозиторий Zabbix
  ansible.builtin.apt:
    deb: /tmp/zabbix-release.deb
  become: true

- name: Обновить кеш apt after adding Zabbix repository
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Установить Zabbix agent
  ansible.builtin.apt:
    name: zabbix-agent
    state: present
  become: true

- name: Создать каталог конфигурации Zabbix agent
  ansible.builtin.file:
    path: /etc/zabbix/zabbix_agentd.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Развернуть конфигурацию Zabbix agent
  ansible.builtin.template:
    src: zabbix_agentd.conf.j2
    dest: /etc/zabbix/zabbix_agentd.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Запустить Zabbix agent
  ansible.builtin.service:
    name: zabbix-agent
    state: restarted
    enabled: true
  become: true
