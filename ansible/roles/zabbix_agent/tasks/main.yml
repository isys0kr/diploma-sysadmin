---
- name: Скопировать пакет Zabbix agent
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../packages/zabbix/zabbix-agent_1%3a7.0.30-1+ubuntu24.04_amd64.deb"
    dest: /tmp/zabbix-agent.deb
    mode: "0644"
  become: true

- name: Установить Zabbix agent из локального пакета
  ansible.builtin.apt:
    deb: /tmp/zabbix-agent.deb
    state: present
  become: true

- name: Создать каталог конфигурации Zabbix agent
  ansible.builtin.file:
    path: /etc/zabbix/zabbix_agentd.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Развернуть конфигурацию Zabbix agent
  ansible.builtin.template:
    src: zabbix_agentd.conf.j2
    dest: /etc/zabbix/zabbix_agentd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Перезапустить Zabbix agent
  become: true

- name: Запустить Zabbix agent
  ansible.builtin.service:
    name: zabbix-agent
    state: started
    enabled: true
  become: true
