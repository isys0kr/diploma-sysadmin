---
- name: Установить PostgreSQL и зависимости
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - nginx
      - php-fpm
      - php-pgsql
      - php-gd
      - php-bcmath
      - php-mbstring
      - php-xml
      - php-ldap
      - php-curl
    state: present
    update_cache: true
  become: true

- name: Скопировать пакет Zabbix server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../packages/zabbix/zabbix-server-pgsql_1%3a7.0.30-1+ubuntu24.04_amd64.deb"
    dest: /tmp/zabbix-server-pgsql.deb
    mode: "0644"
  become: true

- name: Скопировать пакет Zabbix frontend
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../packages/zabbix/zabbix-frontend-php_1%3a7.0.30-1+ubuntu24.04_all.deb"
    dest: /tmp/zabbix-frontend-php.deb
    mode: "0644"
  become: true

- name: Скопировать конфигурацию nginx для Zabbix
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../packages/zabbix/zabbix-nginx-conf_1%3a7.0.30-1+ubuntu24.04_all.deb"
    dest: /tmp/zabbix-nginx-conf.deb
    mode: "0644"
  become: true

- name: Скопировать SQL-скрипты Zabbix
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../packages/zabbix/zabbix-sql-scripts_1%3a7.0.30-1+ubuntu24.04_all.deb"
    dest: /tmp/zabbix-sql-scripts.deb
    mode: "0644"
  become: true

- name: Установить локальные пакеты Zabbix server
  ansible.builtin.apt:
    deb: "{{ item }}"
    state: present
  loop:
    - /tmp/zabbix-frontend-php.deb
    - /tmp/zabbix-sql-scripts.deb
    - /tmp/zabbix-server-pgsql.deb
    - /tmp/zabbix-nginx-conf.deb
  become: true

- name: Запустить PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  become: true

- name: Создать пользователя Zabbix в PostgreSQL
  ansible.builtin.shell: |
    if sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='zabbix'" | grep -q 1; then
      echo unchanged
    else
      sudo -u postgres psql -c "CREATE USER zabbix WITH PASSWORD 'zabbix';"
      echo changed
    fi
  args:
    executable: /bin/bash
  register: zabbix_db_user
  changed_when: zabbix_db_user.stdout.strip() == "changed"
  become: true

- name: Создать базу Zabbix
  ansible.builtin.shell: |
    if sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='zabbix'" | grep -q 1; then
      echo unchanged
    else
      sudo -u postgres createdb -O zabbix zabbix
      echo changed
    fi
  args:
    executable: /bin/bash
  register: zabbix_database
  changed_when: zabbix_database.stdout.strip() == "changed"
  become: true

- name: Проверить схему Zabbix
  ansible.builtin.shell: |
    sudo -u postgres psql -d zabbix -tAc \
    "SELECT 1 FROM information_schema.tables WHERE table_name='users';"
  register: zabbix_schema_check
  changed_when: false
  become: true

- name: Импортировать схему Zabbix
  ansible.builtin.shell: |
    zcat /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz | \
    sudo -u zabbix psql zabbix
  args:
    executable: /bin/bash
  when: zabbix_schema_check.stdout.strip() != "1"
  become: true

- name: Развернуть конфигурацию Zabbix server
  ansible.builtin.template:
    src: zabbix_server.conf.j2
    dest: /etc/zabbix/zabbix_server.conf
    owner: root
    group: zabbix
    mode: "0640"
  become: true

- name: Запустить Zabbix server
  ansible.builtin.service:
    name: zabbix-server
    state: started
    enabled: true
  become: true

- name: Удалить лишний PHP-FPM symlink Zabbix
  ansible.builtin.file:
    path: /etc/php/8.3/fpm/pool.d/zabbix.conf
    state: absent
  notify: Перезапустить PHP-FPM
  become: true

- name: Развернуть конфигурацию Zabbix frontend
  ansible.builtin.template:
    src: zabbix.conf.php.j2
    dest: /etc/zabbix/web/zabbix.conf.php
    owner: www-data
    group: www-data
    mode: "0640"
  become: true

- name: Запустить PHP-FPM
  ansible.builtin.service:
    name: php8.3-fpm
    state: started
    enabled: true
  become: true

- name: Отключить стандартный сайт nginx
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Перезапустить nginx
  become: true

- name: Развернуть nginx-конфигурацию Zabbix
  ansible.builtin.template:
    src: nginx-zabbix.conf.j2
    dest: /etc/nginx/sites-available/zabbix
    owner: root
    group: root
    mode: "0644"
  notify: Перезапустить nginx
  become: true

- name: Включить сайт Zabbix
  ansible.builtin.file:
    src: /etc/nginx/sites-available/zabbix
    dest: /etc/nginx/sites-enabled/zabbix
    state: link
  notify: Перезапустить nginx
  become: true

- name: Проверить конфигурацию nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  become: true

- name: Запустить nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  become: true
